name: 🏗️ Project24 Custom Kernel Build (Blueprint Edition)

permissions:
  contents: write
  discussions: write

on:
  workflow_dispatch:
    inputs:
      # --- 1. BASE KERNEL CONFIGURATION ---
      KERNEL_SOURCE:
        description: 'Kernel Source URL'
        required: true
        type: string
        default: 'https://github.com/devhunter1/android_kernel_samsung_s5e8535.git'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        required: true
        type: string
        default: 'lineage-23.2'
      DEVICE_DEFCONFIG:
        description: 'Target Device Defconfig'
        required: true
        type: string
        default: 'm14x_defconfig'

      # --- 2. TOOLCHAIN & ACCELERATION (Combined to stay under 25 limit) ---
      toolchain_mode:
        description: 'Compiler & CCache Selection'
        required: true
        type: choice
        options:
          - llvm22-ccache
          - llvm22-nocache
          - google-clang-ccache
          - google-clang-nocache
        default: llvm22-ccache

      # --- 3. KERNELSU & ROOT STEALTH TOGGLES ---
      ENABLE_KSU:
        description: 'Inject KernelSU / ReSukiSU?'
        type: boolean
        default: true
      KSU_VARIANT:
        description: 'Select KernelSU Variant'
        type: choice
        options:
          - 'ReSukiSU'
          - 'KernelSU (Official)'
          - 'KernelSU-Next'
          - 'wksu'
          - 'None'
        default: 'ReSukiSU'
      MANAGER_BRANCH:
        description: 'KernelSU Manager Branch (main, dev, canary)'
        required: true
        type: string
        default: 'main'
      ENABLE_SUSFS:
        description: 'Apply SUSFS Root Stealth Patches?'
        type: boolean
        default: true
      SUSFS_SHA:
        description: 'SUSFS Commit SHA (Leave empty for latest)'
        required: false
        type: string
        default: 'fbb7462dd4cca04c7d99a56500fe55fe51c3d6a3'

      # --- 4. OPTIMIZATION & FEATURE PATCH CHECKBOXES ---
      ENABLE_KERNEL_OPTIMIZATIONS:
        description: 'Apply Exynos 5.15 Optimization Patch Suite?'
        type: boolean
        default: true
      ENABLE_DROIDSPACE:
        description: 'Apply DroidSpaces Virtualization Patch?'
        type: boolean
        default: true
      ENABLE_CLANG20_FIX:
        description: 'Apply Clang-20/22 sizeof-pointer-memaccess OVT Touchscreen Fix?'
        type: boolean
        default: false
      ENABLE_CECS_PATCH:
        description: 'Apply Disable CECs+ Patch?'
        type: boolean
        default: true

      # --- 5. CONFIGURATION TOGGLES ---
      ENABLE_SU_CONFIG:
        description: 'Bake generated su.config (SUSFS & Anti-Root Bypass)?'
        type: boolean
        default: true
      ENABLE_SELINUX_PERMISSIVE:
        description: 'Force SELinux Permissive Mode via bootline?'
        type: boolean
        default: false
      ENABLE_PERF_CONFIG:
        description: 'Include perf.config?'
        type: boolean
        default: true
      ENABLE_NETHUNTER_CONFIG:
        description: 'Include nethunter.config?'
        type: boolean
        default: false
      ENABLE_CUSTOM_CONFIG:
        description: 'Include custom.config?'
        type: boolean
        default: true
      CUSTOM_CONFIG_URL:
        description: 'URL for custom.config'
        required: false
        type: string
        default: 'https://github.com/MrPankaj24/kernel_patch/blob/main/for_devhunter1/custom.config'

      # --- 6. RELEASE OPTIONS ---
      MAKE_RELEASE:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false
      UPLOAD_TELEGRAM:
        description: 'Upload Build to Telegram?'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    name: 🏗️ Build (${{ github.event.inputs.DEVICE_DEFCONFIG }} | ${{ github.event.inputs.toolchain_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KERNEL_ROOT: ${{ github.workspace }}/kernel_workspace
      OUTDIR: ${{ github.workspace }}/kernel_workspace/out
      MODULES_OUTDIR: ${{ github.workspace }}/kernel_workspace/modules_out
      TARGET_SOC: s5e8535
      SOC_NAME: s5e8535
      PLATFORM_VERSION: 15
      ANDROID_MAJOR_VERSION: t
      ARCH: arm64
      SUBARCH: arm64
      # --- STATIC CONFIG URLS ---
      PERF_CONFIG_URL: 'https://github.com/MrPankaj24/kernel_patch/blob/main/for_devhunter1/perf.config'
      NETHUNTER_CONFIG_URL: 'https://github.com/MrPankaj24/kernel_common_modifications/blob/basic/arch/arm64/configs/nethunter.config'

    steps:
      - name: 🧹 Free Disk Space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: 📥 Checkout Action Repository
        uses: actions/checkout@v4

      - name: 📦 Install Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git lld llvm python3 \
          curl wget libssl-dev libelf-dev python3-setuptools python-is-python3 \
          make gcc gcc-aarch64-linux-gnu binutils binutils-aarch64-linux-gnu g++ \
          cpio zip unzip lz4 zstd xz-utils libncurses-dev libncurses5-dev \
          kmod rsync clang dwarves pahole ccache device-tree-compiler zlib1g-dev \
          libc6-dev-i386 cmake ninja-build file patch sudo

      - name: ⚙️ Export ccache + determinism
        if: contains(github.event.inputs.toolchain_mode, 'ccache')
        run: |
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"
          
          SETTINGS=(
            "CCACHE_DIR=$CACHE_DIR"
            "CCACHE_MAXSIZE=12G"
            "CCACHE_COMPILERCHECK=content"
            "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            "CCACHE_NOHASHDIR=true"
            "CCACHE_IGNOREOPTIONS=-sysroot* -fdebug-prefix-map=* -fmacro-prefix-map=*"
            "CCACHE_COMPRESS=true"
            "CCACHE_COMPRESSLEVEL=8"
            "CCACHE_DIRECT=true"
            "CCACHE_FILE_CLONE=true"
            "CCACHE_INODE_CACHE=true"
            "CCACHE_IS_KERNEL_COMPILING=true"
            "CCACHE_UMASK=002"
            "KBUILD_BUILD_TIMESTAMP=2026-01-01"
            "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,file_stat_matches"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> $GITHUB_ENV
          done

          if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
          fi

      - name: ♻️ Restore ccache
        if: contains(github.event.inputs.toolchain_mode, 'ccache')
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-make-${{ github.event.inputs.toolchain_mode }}-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-make-${{ github.event.inputs.toolchain_mode }}-${{ github.event.inputs.KERNEL_BRANCH }}
            ccache-${{ runner.os }}-make-${{ github.event.inputs.toolchain_mode }}-

      - name: 🔗 Ensure ccache is masked into PATH
        if: contains(github.event.inputs.toolchain_mode, 'ccache')
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV

      - name: ⚡ Setup 25GB Swap (For ThinLTO)
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 25

      - name: 📥 Clone Kernel Source
        run: |
          mkdir -p ${KERNEL_ROOT}
          echo ">>> Cloning Kernel Source: ${{ github.event.inputs.KERNEL_BRANCH }}"
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH }} ${{ github.event.inputs.KERNEL_SOURCE }} ${KERNEL_ROOT}

      - name: 🔧 Setup Toolchain (${{ github.event.inputs.toolchain_mode }})
        run: |
          set -euo pipefail
          mkdir -p ${GITHUB_WORKSPACE}/toolchains
          cd ${GITHUB_WORKSPACE}/toolchains
          
          if [[ "${{ github.event.inputs.toolchain_mode }}" == *"llvm22"* ]]; then
            echo ">>> Installing LLVM 22 from official APT repository..."
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22
            sudo apt-get install -y clang-22 lld-22 llvm-22
            sudo ln -sf /usr/bin/clang-22 /usr/bin/clang || true
            sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld || true
            echo "COMPILER_PATH=/usr/lib/llvm-22/bin:/usr/bin" >> $GITHUB_ENV
            if [[ "${{ github.event.inputs.toolchain_mode }}" == *"ccache"* ]]; then
              echo "COMPILER_CC=ccache clang-22" >> $GITHUB_ENV
            else
              echo "COMPILER_CC=clang-22" >> $GITHUB_ENV
            fi
          else
            echo ">>> Fetching Google Clang (r487747c - Android 14 Stable)..."
            CLANG_VER="clang-r487747c"
            DL_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/${CLANG_VER}.tar.gz"
            mkdir -p ${CLANG_VER}
            curl -L "$DL_URL" -o clang.tar.gz
            tar -xzf clang.tar.gz -C ${CLANG_VER}
            echo "COMPILER_PATH=${GITHUB_WORKSPACE}/toolchains/${CLANG_VER}/bin" >> $GITHUB_ENV
            if [[ "${{ github.event.inputs.toolchain_mode }}" == *"ccache"* ]]; then
              echo "COMPILER_CC=ccache clang" >> $GITHUB_ENV
            else
              echo "COMPILER_CC=clang" >> $GITHUB_ENV
            fi
          fi

      - name: ⬇️ Download AOSP Kernel Build Tools
        run: |
          git clone --depth=1 -b main https://android.googlesource.com/kernel/prebuilts/build-tools ${GITHUB_WORKSPACE}/toolchains/build-tools
          echo "AOSP_TOOLS_PATH=${GITHUB_WORKSPACE}/toolchains/build-tools/linux-x86/bin" >> $GITHUB_ENV

      - name: 📝 Generate Clean su.config
        if: github.event.inputs.ENABLE_SU_CONFIG == 'true'
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Generating su.config with SUSFS and Anti-Root bypasses forced to 'y'..."
          cat > arch/arm64/configs/su.config << 'EOF'
          # KernelSU
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KSU_TRACEPOINT_HOOK=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y

          # SuSFS Configuration
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # Disable Samsung Anti-Root Protection
          CONFIG_UH=n
          CONFIG_RKP=n
          CONFIG_KDP=n
          CONFIG_SECURITY_DEFEX=n
          CONFIG_PROCA=n
          CONFIG_FIVE=n

          # Force Load Kernel Modules
          CONFIG_MODULES=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SRCVERSION_ALL=n
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_COMPRESS=n
          CONFIG_TRIM_UNUSED_KSYMS=n

          # Kallsyms & NTSync Built-in
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_NTSYNC=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="@MrPankaj24"
          EOF
          echo "✅ Generated arch/arm64/configs/su.config successfully!"

      - name: 📝 Generate SELinux Permissive Config
        if: github.event.inputs.ENABLE_SELINUX_PERMISSIVE == 'true'
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Generating permissive.config..."
          cat > arch/arm64/configs/permissive.config << 'EOF'
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0
          # CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set
          # CONFIG_ALWAYS_ENFORCING is not set
          CONFIG_CMDLINE_BOOL=y
          CONFIG_CMDLINE="enforcing=0 androidboot.selinux=permissive"
          CONFIG_CMDLINE_EXTEND=y
          # CONFIG_CMDLINE_OVERRIDE is not set
          EOF
          echo "✅ Generated arch/arm64/configs/permissive.config successfully!"

      - name: 📥 Fetch Individual Extra Configs
        run: |
          cd ${KERNEL_ROOT}/arch/arm64/configs/
          download_config() {
            local url="$1"
            local filename="$2"
            if [ -n "$url" ]; then
              local raw_url=$(echo "$url" | sed 's/github.com/raw.githubusercontent.com/' | sed 's/\/blob\//\//')
              echo ">>> Downloading $filename from $raw_url..."
              curl -LSs "$raw_url" -o "$filename"
            fi
          }
          if [ "${{ github.event.inputs.ENABLE_PERF_CONFIG }}" == "true" ]; then
            download_config "${{ env.PERF_CONFIG_URL }}" "perf.config"
          fi
          if [ "${{ github.event.inputs.ENABLE_NETHUNTER_CONFIG }}" == "true" ]; then
            download_config "${{ env.NETHUNTER_CONFIG_URL }}" "nethunter.config"
          fi
          if [ "${{ github.event.inputs.ENABLE_CUSTOM_CONFIG }}" == "true" ]; then
            download_config "${{ github.event.inputs.CUSTOM_CONFIG_URL }}" "custom.config"
          fi

      - name: 📥 Fetch & Apply DroidSpaces Patch
        if: github.event.inputs.ENABLE_DROIDSPACE == 'true'
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Downloading and applying DroidSpaces patch..."
          curl -LSs "https://raw.githubusercontent.com/MrPankaj24/kernel_patch/main/Droidspace/droidspace_for_1330.patch" -o droidspace_1330.patch
          patch -p1 --forward < droidspace_1330.patch || true
          rm droidspace_1330.patch

      - name: 🛡️ Inject KernelSU Variant & Apply Locked SUSFS Patches
        if: github.event.inputs.ENABLE_KSU == 'true' && github.event.inputs.KSU_VARIANT != 'None'
        run: |
          cd ${KERNEL_ROOT}
          rm -rf KernelSU drivers/kernelsu
          
          CHOICE="${{ github.event.inputs.KSU_VARIANT }}"
          BRANCH="${{ github.event.inputs.MANAGER_BRANCH }}"
          
          if [[ "$CHOICE" == "ReSukiSU" ]]; then
            echo ">>> Injecting ReSukiSU (Branch: $BRANCH)..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/$BRANCH/kernel/setup.sh" | sed "s/main/$BRANCH/g" | bash -s "$BRANCH"
            echo ">>> Applying 70_ksu_safety patch for ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/MrPankaj24/kernel_patch/main/70_ksu_safety-resukisu-5.15.patch" -o ksu_safety.patch
            cd KernelSU && patch -p1 --forward < ../ksu_safety.patch || true && cd ..
            rm ksu_safety.patch
            
          elif [[ "$CHOICE" == *"Official"* ]]; then
            echo ">>> Injecting Official KernelSU (Branch/Commit: $BRANCH)..."
            git clone -b $BRANCH https://github.com/tiann/KernelSU.git KernelSU || git clone https://github.com/tiann/KernelSU.git KernelSU
            cd KernelSU && git checkout $BRANCH || true && cd ..
            git clone -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
            cd susfs4ksu && git checkout d8358055f3410aa8775bb283d6f1c12fcc13c79d && cd ..
            cd KernelSU && patch -p1 --forward < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true && cd ..
            bash KernelSU/kernel/setup.sh
            rm -rf susfs4ksu
            
          elif [[ "$CHOICE" == *"Next"* ]]; then
            echo ">>> Injecting KernelSU-Next (Branch: $BRANCH)..."
            git clone -b $BRANCH https://github.com/rifsxd/KernelSU-Next.git KernelSU
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/$BRANCH/kernel/setup.sh" | bash
            
          elif [[ "$CHOICE" == "wksu" ]]; then
            echo ">>> Injecting wksu (Branch: $BRANCH)..."
            git clone -b $BRANCH https://github.com/WildKernels/Wild_KSU.git KernelSU
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/$BRANCH/kernel/setup.sh" | bash -s $BRANCH
          fi
          
          echo ">>> Symlinking drivers/kernelsu..."
          ln -sf ../KernelSU drivers/kernelsu
          
          # --- APPLY LOCKED SUSFS TO KERNEL TREE ---
          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" ]; then
            echo ">>> Cloning Official SUSFS repository..."
            git clone -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs_repo
            if [ -n "${{ github.event.inputs.SUSFS_SHA }}" ]; then
              echo ">>> Locking SUSFS commit to SHA: ${{ github.event.inputs.SUSFS_SHA }}..."
              cd susfs_repo && git checkout ${{ github.event.inputs.SUSFS_SHA }} && cd ..
            fi
            echo ">>> Copying SUSFS core fs and headers into kernel tree..."
            cp -rf susfs_repo/kernel_patches/fs/* fs/
            cp -rf susfs_repo/kernel_patches/include/linux/* include/linux/
            echo ">>> Applying base patch 50_add_susfs_in_gki-android13-5.15.patch..."
            patch -p1 --forward < susfs_repo/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
            echo ">>> Applying custom reject resolution patch 51_fix_susfs_rejects.patch..."
            curl -LSs "https://raw.githubusercontent.com/MrPankaj24/kernel_patch/refs/heads/main/for_devhunter1/51_susfs_fix.patch" -o 51_fix.patch
            patch -p1 --forward < 51_fix.patch || true
            rm -rf susfs_repo 51_fix.patch
            find . -name "*.orig" -delete -o -name "*.rej" -delete
          fi

      
      - name: 🛡️ Apply ZeroMount, Unicode Fix & Full LTO Patches
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Applying Unicode Bypass Fix (Linux 5.15)..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/unicode_bypass_fix_6.1-.patch" -o unicode.patch
          patch -p1 --forward < unicode.patch || true
          rm unicode.patch

          echo ">>> Applying ZeroMount Path Redirection (Linux 5.15)..."
          curl -LSs "https://raw.githubusercontent.com/jimsterino98/Super-Builders/main/android13-5.15/WildKSU/patches/60_zeromount-android13-5.15.patch" -o zeromount.patch
          patch -p1 --forward < zeromount.patch || true
          rm zeromount.patch

          echo ">>> Injecting ZeroMount task_mmu.c and stat.c hooks via custom fix patch..."
          curl -LSs "https://raw.githubusercontent.com/MrPankaj24/kernel_patch/refs/heads/main/for_devhunter1/zeromount_fix_60.patch" -o zeromount_fix.patch
          patch -p1 --forward < zeromount_fix.patch || true
          rm zeromount_fix.patch

          echo ">>> Applying ZeroMount 65 (Linux 5.15)..."
          curl -LSs "https://raw.githubusercontent.com/Enginex0/Super-Builders/refs/heads/main/android13-5.15/ReSukiSU/patches/_archive/65_zeromount-adb-filter-android13-5.15.patch" -o zeromount65.patch
          patch -p1 --forward < zeromount65.patch || true
          rm zeromount65.patch

          echo ">>> Enabling CONFIG_ZEROMOUNT=y in su.config..."
          if [ -f "arch/arm64/configs/su.config" ]; then
            echo "CONFIG_ZEROMOUNT=y" >> arch/arm64/configs/su.config
          fi

          echo ">>> Enabling Full Clang LTO in arch/Kconfig..."
          if [ -f "arch/Kconfig" ]; then
            sed -i '/^default LTO_NONE$/s/default LTO_NONE/default LTO_CLANG_FULL/' arch/Kconfig || true
          fi

          echo "✅ ZeroMount, Unicode Fix applied successfully!"

      # --- HARDCODED ALWAYS-ON: NTSYNC ---
      - name: 📥 Fetch & Apply NTSYNC Patches (Always Enabled)
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Downloading and applying NTSYNC patches..."
          git clone https://github.com/MrPankaj24/kernel_patch.git temp_patch_repo
          patch -p1 --forward < temp_patch_repo/ntsync_base.patch || true
          patch -p1 --forward < temp_patch_repo/ntsync_compat_android13-5.15.patch || true
          rm -rf temp_patch_repo

      # --- HARDCODED ALWAYS-ON: BASEBAND GUARD (BBG) ---
      - name: 🔒 Inject Baseband Guard (BBG - Always Enabled)
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Setting up Baseband Guard..."
          curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          DEFCONFIG_FILE="arch/arm64/configs/${{ github.event.inputs.DEVICE_DEFCONFIG }}"
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_BBG=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_LOG_BUF_SHIFT=20" >> "$DEFCONFIG_FILE"
            echo 'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> "$DEFCONFIG_FILE"
          fi
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig || true
          
          BBG_C_FILE=$(find . -name "baseband_guard.c" | head -n 1)
          if [ -n "$BBG_C_FILE" ] && grep -q "get_link(dentry, inode, NULL)" "$BBG_C_FILE"; then
            curl -LSs "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/experimental/bbg/bbg_fix_get_link.patch" -o bbg_fix.patch
            patch -p1 --forward < bbg_fix.patch || true
          fi
           
      # --- HARDCODED ALWAYS-ON: RE:KERNEL ---
      - name: ⚡ Inject Re:Kernel Optimization (Always Enabled)
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Injecting Re:Kernel background app freezing optimization..."
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git temp_rekernel_repo
          
          echo ">>> Preparing ./rekernel directory for patches.sh..."
          cp -rp temp_rekernel_repo/Integrate/rekernel ./rekernel
          cp temp_rekernel_repo/Integrate/patches.sh ./
          chmod +x patches.sh
          
          echo ">>> Running patches.sh to integrate driver..."
          ./patches.sh || echo "⚠️ Note: patches.sh reported minor warnings or was already applied."
          
          echo ">>> Injecting jobctl.h header fix..."
          if [ -f "drivers/rekernel/rekernel.h" ]; then
            sed -i '1i #include <linux/sched/jobctl.h>' drivers/rekernel/rekernel.h
            echo "✅ Added jobctl.h to drivers/rekernel/rekernel.h"
          else
            echo "❌ CRITICAL: drivers/rekernel/rekernel.h not found after running patches.sh!"
            exit 1
          fi

          echo ">>> Adding Re:Kernel configs to defconfig..."
          DEFCONFIG_FILE="arch/arm64/configs/${{ github.event.inputs.DEVICE_DEFCONFIG }}"
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_REKERNEL_NETWORK=n" >> "$DEFCONFIG_FILE"
            echo "✅ Enabled CONFIG_REKERNEL=y in ${DEFCONFIG_FILE}"
          fi
          
          echo ">>> Cleaning up temporary Re:Kernel files..."
          rm -rf ./rekernel temp_rekernel_repo patches.sh
          echo "✅ Re:Kernel integrated successfully!"

      - name: 🛠️ Fix Clang-20+ sizeof-pointer-memaccess Error
        if: github.event.inputs.ENABLE_CLANG20_FIX == 'true'
        run: |
          cd ${KERNEL_ROOT}
          echo ">>> Patching OVT touchscreen driver for newer Clang compatibility..."
          find drivers/input/touchscreen/ovt/ -type f -name "*.c" -exec sed -i 's/sizeof(tcm_hcd->print_buf)/SEC_CMD_STR_LEN/g' {} +

      - name: 🛑 Apply CRCs Disable Patch
        if: github.event.inputs.ENABLE_CECS_PATCH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_ROOT}"

          PATCH_URL="https://raw.githubusercontent.com/MrPankaj24/kernel_patch/refs/heads/main/for_devhunter1/CRCs_disable.patch"
          PATCH_FILE="CRCs_disable.patch"

          echo ">>> Downloading CRCs_disable patch..."
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "${PATCH_URL}" -o "${PATCH_FILE}"

          echo ">>> Validating patch..."
          test -s "${PATCH_FILE}" || { echo "❌ Patch file is empty"; exit 1; }
          head -n 1 "${PATCH_FILE}" | grep -qE '^(diff --git|From )' || {
            echo "❌ Not a valid patch file. First lines:"
            head -n 20 "${PATCH_FILE}"
            exit 1
          }

          echo ">>> Checking applicability..."
          if git apply --check "${PATCH_FILE}"; then
            git apply "${PATCH_FILE}"
            echo "✅ CRCs_disable patch applied successfully."
          else
            echo "❌ Patch failed to apply cleanly."
            git apply --check --verbose "${PATCH_FILE}" || true
            exit 1
          fi

          rm -f "${PATCH_FILE}"

      # --- HARDCODED ALWAYS-ON: BBRV3 ---
      - name: 🌐 Apply BBRv3 TCP Congestion Control Patch (Always Enabled)
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_ROOT}"

          PATCH_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch"
          PATCH_FILE="bbrv3.patch"

          echo ">>> Downloading BBRv3 patch..."
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "${PATCH_URL}" -o "${PATCH_FILE}"

          echo ">>> Validating patch..."
          test -s "${PATCH_FILE}" || { echo "❌ Patch file is empty"; exit 1; }
          head -n 1 "${PATCH_FILE}" | grep -qE '^(diff --git|From )' || {
            echo "❌ Not a valid patch file. First lines:"
            head -n 20 "${PATCH_FILE}"
            exit 1
          }

          echo ">>> Applying BBRv3 patch using 'patch -p1' (matching local behavior)..."
          patch -p1 --fuzz=1 --forward < "${PATCH_FILE}"

          echo ">>> Verifying BBRv3 injection..."
          if [ -f "net/ipv4/tcp_bbr3.c" ]; then
            echo "✅ BBRv3 core source (tcp_bbr3.c) successfully injected!"
          else
            echo "❌ CRITICAL: tcp_bbr3.c is missing. BBRv3 will not compile."
            exit 1
          fi

          if grep -q "bbr3" net/ipv4/Kconfig; then
            echo "✅ BBRv3 Kconfig entry successfully injected!"
          else
            echo "⚠️ WARNING: BBRv3 Kconfig entry missing. BBRv3 might not be selectable."
          fi

          rm -f "${PATCH_FILE}"
          find . -name "*.orig" -delete -o -name "*.rej" -delete

      - name: ⚡ Apply Exynos 5.15 Optimization Suite
        if: github.event.inputs.ENABLE_KERNEL_OPTIMIZATIONS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_ROOT}"

          BASE_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common"
          mkdir -p /tmp/wk_patches

          # 1. Standard optimization patches for SM-M146B (Exynos / 5.15)
          PATCHES=(
            "optimized_mem_operations.patch"
            "file_struct_8bytes_align.patch"
            "reduce_cache_pressure.patch"
            "mem_opt_prefetch.patch"
            "int_sqrt.patch"
            "force_tcp_nodelay.patch"
            "reduce_gc_thread_sleep_time.patch"
            "add_timeout_wakelocks_globally.patch"
            "f2fs_reduce_congestion.patch"
            "reduce_freeze_timeout.patch"
            "add_limitation_scaling_min_freq.patch"
            "re_write_limitation_scaling_min_freq.patch"
            "adjust_cpu_scan_order.patch"
            "avoid_extra_s2idle_wake_attempts.patch"
            "disable_cache_hot_buddy.patch"
            "f2fs_enlarge_min_fsync_blocks.patch"
            "increase_ext4_default_commit_age.patch"
            "increase_sk_mem_packets.patch"
            "reduce_pci_pme_wakeups.patch"
            "silence_irq_cpu_logspam.patch"
            "silence_system_logspam.patch"
            "use_unlikely_wrap_cpufreq.patch"
          )

          echo ">>> Downloading and applying standard optimization patches..."
          for p in "${PATCHES[@]}"; do
            echo "  -> Applying ${p}..."
            curl -fL -sS --retry 3 --retry-delay 2 --connect-timeout 20 "${BASE_URL}/${p}" -o "/tmp/wk_patches/${p}"
            patch -p1 --fuzz=2 --forward < "/tmp/wk_patches/${p}" || echo "  ⚠️ Warning: ${p} had minor rejects or was already applied."
          done

          # 2. Exynos Assembly memcmp optimization (Linux 5.15 symbol mode)
          echo ">>> Applying Exynos ARM64 memcmp assembly optimization..."
          curl -fL -sS --retry 3 --retry-delay 2 --connect-timeout 20 "${BASE_URL}/Samsung/optimise_memcmp_exynos.patch" -o "/tmp/wk_patches/optimise_memcmp_exynos.patch"
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
              -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
              -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
              "/tmp/wk_patches/optimise_memcmp_exynos.patch" | patch -p1 --fuzz=2 --forward || true

          # 3. Clear page 16-bytes alignment (Direct apply against SYM_FUNC_START_PI)
          echo ">>> Applying clear_page 16-byte alignment optimization..."
          curl -fL -sS --retry 3 --retry-delay 2 --connect-timeout 20 "${BASE_URL}/clear_page_16bytes_align.patch" -o "/tmp/wk_patches/clear_page_16bytes_align.patch"
          patch -p1 --fuzz=2 --forward < "/tmp/wk_patches/clear_page_16bytes_align.patch" || true

          # 4. Alarmtimer wakelock duration reduction
          echo ">>> Reducing alarmtimer wakelock duration from 2s to ktime min..."
          if [ -f "kernel/time/alarmtimer.c" ]; then
            sed -i 's/pm_wakeup_event(dev, 2 \* MSEC_PER_SEC);/pm_wakeup_event(dev, ktime_to_ms(min) + 1);/' kernel/time/alarmtimer.c || true
          fi

          # 5. Cleanup
          rm -rf /tmp/wk_patches
          find . -name "*.orig" -delete -o -name "*.rej" -delete
          echo "✅ Exynos 5.15 optimization suite applied successfully!"
      
      - name: 🧼 Remove -dirty tag (Commit all changes)
        run: |
          cd ${KERNEL_ROOT}
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action Bot"
          echo ">>> Committing all kernel patches to remove -dirty version tag..."
          git add -A
          git commit -m "auto: apply all patches, configs, and optimizations" || true
          if [ -d "KernelSU/.git" ]; then
            cd KernelSU && git add -A && git commit -m "auto: apply su module patches" || true && cd ..
          fi

      - name: 🔨 Compile Kernel Image
        run: |
          set -euo pipefail
          cd ${KERNEL_ROOT}
          mkdir -p ${OUTDIR}
          
          # --- ABI & KMI Settings (Nuke checks from Blueprint) ---
          export ABI_DEFINITION=
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export SKIP_ABI_CHECKS=1
          export KMI_ENFORCE=0
          export LTO=full

          export PATH="${COMPILER_PATH}:${AOSP_TOOLS_PATH}:$PATH"
          export CC="${COMPILER_CC}"
          export HOSTCC="${COMPILER_CC}"
          export LD=ld.lld
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export DTC_FLAGS="-@"
          export PLATFORM_VERSION=15
          export ANDROID_MAJOR_VERSION=t

          CONFIG_ARGS="${{ github.event.inputs.DEVICE_DEFCONFIG }}"
          if [ "${{ github.event.inputs.ENABLE_SU_CONFIG }}" == "true" ] && [ -f "arch/arm64/configs/su.config" ]; then CONFIG_ARGS="$CONFIG_ARGS su.config"; fi
          if [ "${{ github.event.inputs.ENABLE_SELINUX_PERMISSIVE }}" == "true" ] && [ -f "arch/arm64/configs/permissive.config" ]; then CONFIG_ARGS="$CONFIG_ARGS permissive.config"; fi
          if [ "${{ github.event.inputs.ENABLE_PERF_CONFIG }}" == "true" ] && [ -f "arch/arm64/configs/perf.config" ]; then CONFIG_ARGS="$CONFIG_ARGS perf.config"; fi
          if [ "${{ github.event.inputs.ENABLE_NETHUNTER_CONFIG }}" == "true" ] && [ -f "arch/arm64/configs/nethunter.config" ]; then CONFIG_ARGS="$CONFIG_ARGS nethunter.config"; fi
          if [ "${{ github.event.inputs.ENABLE_CUSTOM_CONFIG }}" == "true" ] && [ -f "arch/arm64/configs/custom.config" ]; then CONFIG_ARGS="$CONFIG_ARGS custom.config"; fi
          
          echo "===================================================="
          echo "Configuring and Building for ${{ github.event.inputs.DEVICE_DEFCONFIG }} via ${{ github.event.inputs.toolchain_mode }}"
          echo "===================================================="
          
          make O="${OUTDIR}" CC="${CC}" $CONFIG_ARGS
          make -j$(nproc --all) O="${OUTDIR}" CC="${CC}" 2>&1 | tee build.log

          if [[ "${{ github.event.inputs.toolchain_mode }}" == *"ccache"* ]]; then
            ccache -s
          fi

      - name: 🧩 Compile & Strip Modules
        run: |
          set -euo pipefail
          cd ${KERNEL_ROOT}
          mkdir -p ${MODULES_OUTDIR}
          export PATH="${COMPILER_PATH}:${AOSP_TOOLS_PATH}:$PATH"
          export CC="${COMPILER_CC}"
          export LD=ld.lld
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc --all) O="${OUTDIR}" CC="${CC}" INSTALL_MOD_STRIP="--strip-debug --keep-section=.ARM.attributes" INSTALL_MOD_PATH="${MODULES_OUTDIR}" modules_install 2>&1 | tee -a build.log || true

      - name: 📦 Package Artifacts (AnyKernel3 & Modules)
        run: |
          set -euo pipefail
          mkdir -p ${GITHUB_WORKSPACE}/artifacts
          
          # 1. AnyKernel3 Flashable Zip
          echo ">>> Cloning AnyKernel3..."
          git clone --depth=1 https://github.com/MrPankaj24/AnyKernel3.git ${GITHUB_WORKSPACE}/AnyKernel3
          
          if [ -f "${OUTDIR}/arch/arm64/boot/Image" ]; then
            cp "${OUTDIR}/arch/arm64/boot/Image" "${GITHUB_WORKSPACE}/AnyKernel3/"
          else
            echo "❌ Kernel Image not found in ${OUTDIR}/arch/arm64/boot/Image!"
            exit 1
          fi
          
          cd ${GITHUB_WORKSPACE}/AnyKernel3
          rm -rf .git README.md
          SHORT_DEVICE=$(echo "${{ github.event.inputs.DEVICE_DEFCONFIG }}" | sed 's/_defconfig//')
          AK3_ZIP_NAME="Project24-Kernel-${SHORT_DEVICE}-${{ github.event.inputs.KSU_VARIANT }}.zip"
          zip -r9 "${GITHUB_WORKSPACE}/artifacts/${AK3_ZIP_NAME}" ./*
          echo "✅ AnyKernel3 Flashable Zip created: ${AK3_ZIP_NAME}"
          
          # 2. Stripped Modules Zip
          echo ">>> Packaging Stripped Modules..."
          cd ${MODULES_OUTDIR}
          MODULES_ZIP_NAME="Project24-Modules-${SHORT_DEVICE}-${{ github.event.inputs.KSU_VARIANT }}.zip"
          if [ -d "lib" ]; then 
            rm -f lib/modules/*/build lib/modules/*/source
            zip -r9y "${GITHUB_WORKSPACE}/artifacts/${MODULES_ZIP_NAME}" lib/*
            echo "✅ Modules packed: ${MODULES_ZIP_NAME}"
          else
            echo "⚠️ No modules found to pack!"
          fi

      - name: ⬆️ Upload Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project24-${{ github.event.inputs.DEVICE_DEFCONFIG }}-${{ github.event.inputs.KSU_VARIANT }}-build
          path: ${{ github.workspace }}/artifacts/
          retention-days: 7

      - name: 🏷️ Format Safe Release Tag
        if: github.event.inputs.MAKE_RELEASE == 'true'
        run: |
          SAFE_VARIANT=$(echo "${{ github.event.inputs.KSU_VARIANT }}" | tr -d ' ()')
          SHORT_DEVICE=$(echo "${{ github.event.inputs.DEVICE_DEFCONFIG }}" | sed 's/_defconfig//')
          echo "SAFE_TAG=P24-${SHORT_DEVICE}-${SAFE_VARIANT}-Run${{ github.run_number }}" >> $GITHUB_ENV

      - name: 🚀 Publish GitHub Release
        if: github.event.inputs.MAKE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Project 24 Kernel (${{ github.event.inputs.DEVICE_DEFCONFIG }}) - Run ${{ github.run_number }}
          tag_name: ${{ env.SAFE_TAG }}
          body: |
            ### ⚡ Project 24 Custom Kernel (Blueprint Edition)
            
            > [!WARNING]
            > **DISCLAIMER:** This kernel is for experimental purposes. Flash at your own risk! Make sure you have a working backup before flashing.

            #### ✨ Core Features & Optimizations:
            * **Root Stealth:** Integrated with KernelSU / SUSFS / Zeromount to bypass root detection.
            * **Cellular Security:** Baseband Guard (BBG) blocks malicious cellular network attacks.
            * **Virtualization:** Full kernel-level support for DroidSpaces containers.
            * **Background Optimization:** Re:Kernel integrated for zero-lag background app freezing.
            * **Network & Sync:** TCP BBRv3 congestion control and NTSync Windows translation primitives built-in.
            * **Build System:** Compiled with ccache acceleration and ThinLTO optimizations.
            
            | Parameter | Value |
            | :--- | :--- |
            | **Defconfig** | `${{ github.event.inputs.DEVICE_DEFCONFIG }}` |
            | **Toolchain Mode** | `${{ github.event.inputs.toolchain_mode }}` |
            | **Root Variant** | `${{ github.event.inputs.KSU_VARIANT }}` |
            | **Manager Branch** | `${{ github.event.inputs.MANAGER_BRANCH }}` |
            | **Kernel Branch** | `${{ github.event.inputs.KERNEL_BRANCH }}` |
            | **SUSFS Commit Pinned** | `${{ github.event.inputs.SUSFS_SHA }}` |
            
            *This release was automatically compiled and published by GitHub Actions.*
          files: |
            ${{ github.workspace }}/artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Upload to Telegram
        if: github.event.inputs.UPLOAD_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # --- Validate secrets ---
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set in repo secrets!"
            exit 1
          fi

          SHORT_DEVICE=$(echo "${{ github.event.inputs.DEVICE_DEFCONFIG }}" | sed 's/_defconfig//')
          KSU_VARIANT="${{ github.event.inputs.KSU_VARIANT }}"
          COMPILER="${{ github.event.inputs.toolchain_mode }}"
          BRANCH="${{ github.event.inputs.KERNEL_BRANCH }}"
          RUN_NUM="${{ github.run_number }}"

          # --- Build caption message ---
          CAPTION="⚡ *Project 24 Kernel Build*
          
          📱 Device: \`${SHORT_DEVICE}\`
          🔧 Toolchain: \`${COMPILER}\`
          🛡️ Root: \`${KSU_VARIANT}\`
          🌿 Branch: \`${BRANCH}\`
          🔄 Run: #${RUN_NUM}
          📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')

          _Powered by GitHub Actions_"

          API_URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          # --- Send caption as a separate message first ---
          echo ">>> Sending build info message..."
          curl -s -X POST "${API_URL}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${CAPTION}" \
            -d disable_web_page_preview=true \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('✅ Message sent' if r.get('ok') else f'❌ Failed: {r}')"

          # --- Upload each zip artifact ---
          ARTIFACT_DIR="${{ github.workspace }}/artifacts"
          UPLOADED=0
          FAILED=0

          for FILE in "${ARTIFACT_DIR}"/*.zip; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            FILESIZE=$(du -h "$FILE" | cut -f1)
            echo ">>> Uploading ${FILENAME} (${FILESIZE})..."

            RESPONSE=$(curl -s -X POST "${API_URL}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document="@${FILE}" \
              -F caption="📦 ${FILENAME} (${FILESIZE})" \
              --max-time 600)

            if echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); sys.exit(0 if r.get('ok') else 1)"; then
              echo "✅ ${FILENAME} uploaded successfully!"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "❌ Failed to upload ${FILENAME}"
              echo "   Response: ${RESPONSE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "  Telegram Upload Summary"
          echo "  ✅ Uploaded: ${UPLOADED}"
          echo "  ❌ Failed:   ${FAILED}"
          echo "========================================="

          if [ "${FAILED}" -gt 0 ]; then
            echo "⚠️ Some uploads failed — check Telegram API response above"
          fi    

      - name: 🧹 Cleanup Workspace
        if: always()
        run: rm -rf ${{ github.workspace }}/kernel_workspace/out
