name: 🧪 Test KCAL & Recovery Patches

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source URL to Test Against'
        required: true
        default: 'https://github.com/devhunter1/android_kernel_samsung_s5e8535.git'
      KERNEL_BRANCH:
        description: 'Kernel Branch to Test Against'
        required: true
        default: 'lineage-24.0'

jobs:
  test-patches:
    name: 🧩 Test Patch Application
    runs-on: ubuntu-24.04

    steps:
      - name: 🧹 Prepare Workspace
        run: |
          rm -rf *
          mkdir -p artifacts

      - name: 📥 Clone Target Kernel Source
        run: |
          echo ">>> Cloning Kernel Source: ${{ github.event.inputs.KERNEL_BRANCH }}"
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH }}${{ github.event.inputs.KERNEL_SOURCE }} kernel_workspace

      - name: 📥 Fetch Patch Repository
        run: |
          echo ">>> Cloning MrPankaj24/kernel_patch repository..."
          git clone https://github.com/MrPankaj24/kernel_patch.git patch_workspace

      - name: 🛠️ Apply KCAL & Recovery Patches
        run: |
          cd kernel_workspace
          HAS_ERRORS=false
          
          echo ">>> Attempting to apply 07_kcal_dqe.patch..."
          # Check the exit code directly instead of relying on || true
          if ! patch -p1 --forward < ../patch_workspace/1330/test/07_kcal_dqe.patch > ../patch1_output.log 2>&1; then
            echo "❌ ERROR: 07_kcal_dqe.patch failed or is malformed!"
            HAS_ERRORS=true
          fi
          
          echo ">>> Attempting to apply 01_autonomous_recovery.patch..."
          if ! patch -p1 --forward < ../patch_workspace/1330/test/01_autonomous_recovery.patch > ../patch2_output.log 2>&1; then
            echo "❌ ERROR: 01_autonomous_recovery.patch failed or is malformed!"
            HAS_ERRORS=true
          fi
          
          cd ..
          
          echo "--- PATCH 1 (KCAL DQE) OUTPUT LOG ---"
          cat patch1_output.log
          echo "-------------------------------------"
          echo "--- PATCH 2 (AUTONOMOUS RECOVERY) OUTPUT LOG ---"
          cat patch2_output.log
          echo "------------------------------------------------"
          
          if [ "$HAS_ERRORS" = "true" ]; then
            echo "❌ WARNING: One or more patches encountered conflicts or syntax errors."
            echo "HAS_REJECTS=true" >> $GITHUB_ENV
            
            # Move the logs and any generated reject files to the artifacts folder
            find kernel_workspace -name "*.rej" -exec cp --parents {} artifacts/ \;
            cp patch1_output.log artifacts/ || true
            cp patch2_output.log artifacts/ || true
            
            # Force the GitHub Action to fail so it shows a red 'X'
            exit 1
          else
            echo "✅ SUCCESS: Both patches applied cleanly
